[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/cron.log
stderr_logfile=/var/log/supervisor/cron-error.log

[program:ssh]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/ssh.log
stderr_logfile=/var/log/supervisor/ssh-error.log

[program:slapd]
command=/usr/sbin/slapd -h "ldap:/// ldaps:///" -g openldap -u openldap -F /etc/ldap/slapd.d -d 0
autostart=true
autorestart=true
priority=35
stdout_logfile=/var/log/supervisor/slapd.log
stderr_logfile=/var/log/supervisor/slapd-error.log

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/apache2.log
stderr_logfile=/var/log/supervisor/apache2-error.log
stopasgroup=true
killasgroup=true

[program:postfix]
command=/usr/lib/postfix/sbin/master -c /etc/postfix -d
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/postfix.log
stderr_logfile=/var/log/supervisor/postfix-error.log

[program:dovecot]
command=/usr/sbin/dovecot -F
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/dovecot.log
stderr_logfile=/var/log/supervisor/dovecot-error.log

[program:bind9]
command=/usr/sbin/named -f -u bind
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/bind9.log
stderr_logfile=/var/log/supervisor/bind9-error.log

[program:webmin]
command=/usr/share/webmin/miniserv.pl /etc/webmin/miniserv.conf
autostart=true
autorestart=true
priority=60
stdout_logfile=/var/log/supervisor/webmin.log
stderr_logfile=/var/log/supervisor/webmin-error.log

[program:php56-fpm]
command=/usr/sbin/php-fpm5.6 -F
autostart=true
autorestart=true
priority=45
stdout_logfile=/var/log/supervisor/php56-fpm.log
stderr_logfile=/var/log/supervisor/php56-fpm-error.log

[program:php70-fpm]
command=/usr/sbin/php-fpm7.0 -F
autostart=true
autorestart=true
priority=45
stdout_logfile=/var/log/supervisor/php70-fpm.log
stderr_logfile=/var/log/supervisor/php70-fpm-error.log

[program:php71-fpm]
command=/usr/sbin/php-fpm7.1 -F
autostart=true
autorestart=true
priority=45
stdout_logfile=/var/log/supervisor/php71-fpm.log
stderr_logfile=/var/log/supervisor/php71-fpm-error.log

[program:php72-fpm]
command=/usr/sbin/php-fpm7.2 -F
autostart=true
autorestart=true
priority=45
stdout_logfile=/var/log/supervisor/php72-fpm.log
stderr_logfile=/var/log/supervisor/php72-fpm-error.log

[program:php73-fpm]
command=/usr/sbin/php-fpm7.3 -F
autostart=true
autorestart=true
priority=45
stdout_logfile=/var/log/supervisor/php73-fpm.log
stderr_logfile=/var/log/supervisor/php73-fpm-error.log

[program:php74-fpm]
command=/usr/sbin/php-fpm7.4 -F
autostart=true
autorestart=true
priority=45
stdout_logfile=/var/log/supervisor/php74-fpm.log
stderr_logfile=/var/log/supervisor/php74-fpm-error.log

[program:php80-fpm]
command=/usr/sbin/php-fpm8.0 -F
autostart=true
autorestart=true
priority=45
stdout_logfile=/var/log/supervisor/php80-fpm.log
stderr_logfile=/var/log/supervisor/php80-fpm-error.log

[program:php81-fpm]
command=/usr/sbin/php-fpm8.1 -F
autostart=true
autorestart=true
priority=45
stdout_logfile=/var/log/supervisor/php81-fpm.log
stderr_logfile=/var/log/supervisor/php81-fpm-error.log

[program:php82-fpm]
command=/usr/sbin/php-fpm8.2 -F
autostart=true
autorestart=true
priority=45
stdout_logfile=/var/log/supervisor/php82-fpm.log
stderr_logfile=/var/log/supervisor/php82-fpm-error.log

[program:php83-fpm]
command=/usr/sbin/php-fpm8.3 -F
autostart=true
autorestart=true
priority=45
stdout_logfile=/var/log/supervisor/php83-fpm.log
stderr_logfile=/var/log/supervisor/php83-fpm-error.log

[program:fail2ban]
command=/usr/bin/python3 /usr/bin/fail2ban-server -xf start
autostart=true
autorestart=true
priority=70
stdout_logfile=/var/log/supervisor/fail2ban.log
stderr_logfile=/var/log/supervisor/fail2ban-error.log

[group:services]
programs=cron,ssh,slapd,apache2,postfix,dovecot,bind9,webmin,fail2ban

[group:php-fpm]
programs=php56-fpm,php70-fpm,php71-fpm,php72-fpm,php73-fpm,php74-fpm,php80-fpm,php81-fpm,php82-fpm,php83-fpm