global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'virtualmin-monitor'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Node Exporter - System metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          host: 'virtualmin'

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # MySQL Exporter
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels:
          service: 'mysql'
          database: 'mariadb'

  # Apache Exporter
  - job_name: 'apache'
    static_configs:
      - targets: ['apache-exporter:9117']
        labels:
          service: 'apache'
          webserver: 'apache2'

  # Virtualmin Container metrics
  - job_name: 'virtualmin'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['tkvmin:9090']
        labels:
          service: 'virtualmin'
          container: 'main'

  # Docker daemon metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['172.16.235.1:9323']
        labels:
          service: 'docker'

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

  # PHP-FPM metrics (if exposed)
  - job_name: 'php-fpm'
    static_configs:
      - targets:
        - 'tkvmin:9056'  # PHP 5.6
        - 'tkvmin:9070'  # PHP 7.0
        - 'tkvmin:9071'  # PHP 7.1
        - 'tkvmin:9072'  # PHP 7.2
        - 'tkvmin:9073'  # PHP 7.3
        - 'tkvmin:9074'  # PHP 7.4
        - 'tkvmin:9080'  # PHP 8.0
        - 'tkvmin:9081'  # PHP 8.1
        - 'tkvmin:9082'  # PHP 8.2
        - 'tkvmin:9083'  # PHP 8.3
    relabel_configs:
      - source_labels: [__address__]
        regex: 'tkvmin:90(..)'
        target_label: php_version
        replacement: '${1}'

  # Mail server metrics
  - job_name: 'postfix'
    static_configs:
      - targets: ['tkvmin:9154']
        labels:
          service: 'postfix'
          mailserver: 'postfix'

  # DNS server metrics
  - job_name: 'bind'
    static_configs:
      - targets: ['tkvmin:9119']
        labels:
          service: 'bind9'
          dns: 'bind'